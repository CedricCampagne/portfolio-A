<header class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

    <a
      routerLink="/"
      class="font-bold text-lg text-gray-900"
    >
      Cedric Campagne
    </a>

    <!-- Desktop -->
    <nav class="hidden md:flex items-center gap-8 text-sm">

      @for (link of links; track link.name) {
        <a
          [href]="link.href"
          class="text-gray-600 hover:text-green-600 transition"
        >
          {{ link.name }}
        </a>
      }

      <a
        href="https://github.com/CedricCampagne"
        target="_blank"
        class="border border-green-500 text-white bg-green-500 px-3 py-1 rounded hover:bg-white hover:text-green-500 transition duration-500"
      >
        GitHub
      </a>

    </nav>


    <!-- Burger -->
    <button
      class="md:hidden text-green-600 cursor-pointer"
      (click)="toggleMenu()"
    >
      @if (!open()) {
        ☰
      }
      @else {
        ✕
      }
    </button>

  </div>


  <!-- Mobile -->
  @if (open()) {

    <div
      class="md:hidden px-6 py-6 flex flex-col items-center gap-4 border-t border-b border-green-500 transition-all duration-300"
    >

      @for (link of links; track link.name) {

        <a
          [href]="link.href"
          class="text-gray-700 hover:text-green-600 text-lg py-1"
          (click)="closeMenu()"
        >
          {{ link.name }}
        </a>

      }


      <a
        href="https://github.com/CedricCampagne"
        target="_blank"
        class="text-green-600 font-semibold"
        (click)="closeMenu()"
      >
        GitHub
      </a>

    </div>

  }

</header>
