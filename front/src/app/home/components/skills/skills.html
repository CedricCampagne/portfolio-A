<section
  id="skills"
  class="py-20 px-6 sm:px-8 lg:px-0 max-w-6xl mx-auto"
>

  <h2 class="text-4xl font-bold mb-16 text-gray-900 text-center">
    Compétences Techniques
  </h2>


  @for (category of categories; track category) {

    <h3
      class="text-2xl font-bold text-gray-800 mb-8 mt-12 text-center"
    >
      {{ category }}
    </h3>


    <div class="flex flex-wrap justify-center gap-10">

      @for (
        skill of skills.filter(s => s.category === category);
        track skill.name
      ) {

        <div
          class="bg-white border-b-4 border-green-500 shadow-lg
          rounded-xl p-6 flex flex-col items-center
          hover:shadow-2xl hover:scale-105
          transition-all duration-400 ease-in-out w-52"
        >

          <!-- <iconify-icon
            [icon]="skill.icon"
            class="text-green-500 w-12 h-12 mb-4"
          ></iconify-icon> -->


          <p class="font-semibold text-gray-900 text-center">
            {{ skill.name }}
          </p>

        </div>

      }

    </div>

  }

</section>
